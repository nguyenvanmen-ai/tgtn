<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn trắc nghiệm - Tình hình tôn giáo trên thế giới và ở Việt Nam</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mut:#5d667a;--bd:#d9deea;--pri:#2e5597;--pritx:#fff;--ok:#1e8e4e;--okbg:#e4f5ea;--no:#c0392b;--nobg:#fbe9e7}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mut:#9aa3b8;--bd:#2f364b;--pri:#6c9bf0;--pritx:#0d1220;--ok:#4cc382;--okbg:#17332551;--no:#ff7b6b;--nobg:#3a1c1951}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;padding:16px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1.35rem;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 16px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
label.row{display:flex;gap:10px;align-items:center;padding:8px 0;cursor:pointer}
.btn{background:var(--pri);color:var(--pritx);border:0;border-radius:10px;padding:12px 18px;font-size:1rem;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 14px}
.bar>i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem}
.q{font-size:1.1rem;font-weight:600;margin:6px 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:9px;font-size:1rem;cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt b.l{min-width:1.4em;color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg)}
.opt:disabled{cursor:default}
.fb{margin-top:6px;font-weight:600}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.score{font-size:2.2rem;font-weight:700;color:var(--pri);margin:4px 0}
.wr{border-top:1px solid var(--bd);padding:12px 0}
.wr .a{color:var(--ok);font-weight:600}.wr .y{color:var(--no)}
.hide{display:none}
input[type=text]{width:100%;font-size:1rem;padding:12px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font-family:inherit}
select{font-size:1rem;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
input[type=text]{width:100%;font-size:1rem;padding:11px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font-family:inherit}
.err{color:var(--no);font-size:.9rem;margin-top:6px}
.opt.sel{border-color:var(--pri);background:var(--okbg)}
.wr .y.n{color:var(--mut)}
.timer{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.15rem;color:var(--pri)}
.timer.low{color:var(--no)}
.tbox{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.note{background:var(--nobg);color:var(--no);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<h1>Ôn trắc nghiệm – Tình hình tôn giáo trên thế giới và ở Việt Nam</h1>
<p class="sub">Bài 2 · <span id="total"></span> câu · Chọn đáp án, nộp bài để xem kết quả</p>

<section id="start" class="card">
  <p style="margin-top:0"><b>Họ và tên</b></p>
  <input type="text" id="name" maxlength="60" placeholder="Nhập họ tên của bạn" autocomplete="name">
  <div id="nameErr" class="err hide">Vui lòng nhập họ tên trước khi làm bài.</div>
  <p><b>Tùy chọn làm bài</b></p>
  <p class="sub" style="margin:0 0 4px">Mỗi bài gồm <b>20 câu</b> ngẫu nhiên.</p>
  <label class="row">Thời gian mỗi câu:&nbsp;<select id="tpq"></select></label>
  <div id="tsum" class="sub" style="margin:0 0 6px"></div>
  <label class="row"><input type="checkbox" id="shuffleQ" checked> Xáo trộn thứ tự câu hỏi</label>
  <label class="row"><input type="checkbox" id="shuffleA" checked> Xáo trộn thứ tự đáp án</label>
  <label class="row"><input type="checkbox" id="instant"> Hiện đúng/sai ngay sau mỗi câu (bỏ chọn = chỉ xem kết quả khi nộp bài)</label>
  <p id="best" class="sub" style="margin:8px 0 0"></p>
  <div class="btns"><button class="btn" id="go">Bắt đầu làm bài</button></div>
</section>

<section id="quiz" class="hide">
  <div class="card">
    <div class="tbox"><span class="timer" id="tm">00:00</span><span class="meta" style="gap:14px"><span id="pos"></span><span id="sc"></span></span></div>
    <div class="bar"><i id="pb"></i></div>
    <div class="q" id="qt"></div>
    <div id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="btns"><button class="btn sec" id="prev">Câu trước</button><button class="btn" id="next">Câu tiếp</button><button class="btn sec" id="quit">Thoát</button></div>
  </div>
</section>

<section id="result" class="hide">
  <div class="card">
    <div id="tnote" class="note hide"></div>
    <div>Họ và tên: <b id="rn"></b></div>
    <div style="margin-top:6px">Số câu đúng / tổng số câu</div>
    <div class="score" id="rs"></div>
    <div id="rm" class="sub"></div>
    <div id="ru" class="sub"></div>
    <div class="btns">
      <button class="btn" id="again">Làm lại</button>
      <button class="btn sec" id="redo">Làm lại các câu sai</button>
      <button class="btn sec" id="home">Về đầu</button>
    </div>
  </div>
  <div class="card hide" id="wrongBox"><b>Các câu làm sai</b><div id="wl"></div></div>
</section>
</div>

<script>
const DATA = [["Sau Chiến tranh lạnh kết thúc (1991), cục diện thế giới chuyển biến theo hướng nào?", "Đa cực, đa tầng, phân mảnh, phân tuyến", "Một cực duy nhất do Mỹ chi phối", "Hai cực Xô - Mỹ được củng cố", "Thống nhất hoàn toàn, không còn cạnh tranh"], ["Từ năm 1991 đến năm 2000, có trên 100 cuộc chiến tranh, xung đột vũ trang quy mô lớn; trên bao nhiêu % liên quan trực tiếp đến vấn đề tôn giáo và dân tộc?", "Trên 90%", "Trên 50%", "Trên 70%", "Trên 30%"], ["Vì sao Mỹ vẫn là cường quốc lớn nhất nhưng không nắm được độc quyền bá chủ thế giới?", "Do sự trỗi dậy và xích lại gần nhau giữa Trung Quốc, Ấn Độ và Nga", "Do khối NATO tan rã hoàn toàn", "Do Mỹ suy giảm hoàn toàn về quốc phòng", "Do Liên minh châu Âu thay thế vị trí của Mỹ"], ["Khu vực nào được xác định là trung tâm phát triển năng động nhất thế giới nhưng cũng là khu vực trọng điểm cạnh tranh chiến lược giữa các nước lớn?", "Châu Á - Thái Bình Dương và Ấn Độ Dương", "Châu Âu và Bắc Mỹ", "Trung Đông và Bắc Phi", "Châu Phi cận Sahara"], ["Theo số liệu của Oxfam năm 2024, 1,0% người giàu nhất sở hữu bao nhiêu % tổng tài sản của nhân loại?", "45%", "25%", "60%", "10%"], ["Theo báo cáo G20 được giáo trình dẫn, tại 83% quốc gia - nơi sinh sống của bao nhiêu % dân số thế giới - bất bình đẳng gia tăng?", "90%", "50%", "70%", "30%"], ["Nhân tố nào vừa thúc đẩy phân công lao động quốc tế và các dòng người di cư mang theo tôn giáo, vừa tạo môi trường để tôn giáo phát triển vượt biên giới quốc gia?", "Toàn cầu hóa", "Chiến tranh lạnh", "Chủ nghĩa dân tộc cực đoan", "Suy thoái môi trường"], ["Thành tựu khoa học công nghệ (Cách mạng công nghiệp 4.0) tác động như thế nào đến đời sống tôn giáo?", "Cung cấp phương tiện truyền đạo mới nhưng làm giảm tính “thiêng”, thế tục hóa đời sống tôn giáo", "Chỉ làm tôn giáo suy giảm hoàn toàn", "Chỉ làm tăng tính “thiêng” của tôn giáo", "Không có tác động gì đến tôn giáo"], ["Khủng hoảng niềm tin vào mô hình xã hội nào được nêu là điều kiện thuận lợi cho tôn giáo phát triển những thập niên gần đây?", "Mô hình chủ nghĩa xã hội hiện thực ở Đông Âu và Liên Xô sau 70 năm tồn tại", "Mô hình tư bản chủ nghĩa ở Mỹ", "Mô hình phong kiến ở châu Á", "Mô hình kinh tế thị trường ở ASEAN"], ["Sau Chiến tranh thế giới thứ hai, tôn giáo suy giảm nhanh; đến thập niên nào tôn giáo phục hồi và phát triển trở lại?", "Những năm 70 của thế kỷ XX", "Những năm 50 của thế kỷ XX", "Những năm 90 của thế kỷ XX", "Đầu thế kỷ XXI"], ["Từ năm 1970 đến năm 2000, tín đồ tôn giáo tăng 55%, số người không theo tôn giáo thay đổi như thế nào?", "Giảm 4,6%, xuống còn 15,2% dân số thế giới", "Tăng 4,6%, lên 25,2% dân số thế giới", "Giảm 15,2%, xuống còn 4,6% dân số thế giới", "Không thay đổi"], ["Năm 2025, Công giáo có khoảng bao nhiêu tín đồ và đứng vị trí nào về số lượng tín đồ?", "1,406 tỷ, vị trí thứ hai", "1,406 tỷ, vị trí thứ nhất", "870 triệu, vị trí thứ hai", "1,92 tỷ, vị trí thứ nhất"], ["Tôn giáo nào tăng nhanh nhất và có số lượng tín đồ nhiều nhất thế giới hiện nay?", "Hồi giáo", "Công giáo", "Tin lành", "Phật giáo"], ["Tín đồ Hồi giáo từ 600 triệu người (1970) tăng lên bao nhiêu vào năm 2020?", "1,92 tỷ người", "1,2 tỷ người", "870 triệu người", "535 triệu người"], ["Tín đồ Tin lành từ 363,7 triệu người (1970) tăng lên bao nhiêu vào năm 2023?", "870 triệu người", "535 triệu người", "1,2 tỷ người", "285 triệu người"], ["Ấn Độ giáo phát triển nhanh chủ yếu do nguyên nhân nào?", "Gia tăng dân số tự nhiên của người Ấn Độ và sự cải đạo ở một số nơi", "Sự truyền đạo bằng chiến tranh", "Chính sách quốc đạo của các nước phương Tây", "Sự sáp nhập với Phật giáo"], ["Phật giáo có 235 triệu tín đồ (1970), tăng lên 535 triệu (2020); khoảng bao nhiêu % tín đồ sống ở các nước châu Á?", "Gần 99%", "Khoảng 60%", "Khoảng 80%", "Khoảng 40%"], ["Chính thống giáo có 142 triệu tín đồ năm 1970, đến năm 2020 tăng lên bao nhiêu?", "285 triệu tín đồ", "535 triệu tín đồ", "142 triệu tín đồ (không đổi)", "870 triệu tín đồ"], ["Hiện tượng tôn giáo mới xuất hiện đầu tiên ở đâu, vào thời gian nào?", const $ = id => document.getElementById(id);
const L = ["A","B","C","D"];
let list=[], i=0, student="", instant=false, timer=null, endAt=0, totalSec=0, startAt=0;

function shuf(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function show(id){["start","quiz","result"].forEach(s=>$(s).classList.toggle("hide",s!==id));window.scrollTo(0,0);}
function ls(op,k,v){try{return op==="g"?localStorage.getItem(k):localStorage.setItem(k,v);}catch(e){return null;}}

$("total").textContent = DATA.length;
$("name").value = ls("g","tg_name")||"";
const NQ=20;
[0.5,1,1.5,2,3].forEach(m=>{
  const o=document.createElement("option");o.value=m;o.textContent=(m+"").replace(".",",")+" phút/câu";if(m===1)o.selected=true;$("tpq").appendChild(o);
});
function fmt(sec){sec=Math.max(0,Math.round(sec));const m=Math.floor(sec/60),r=sec%60;return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");}
function sumTime(){const t=parseFloat($("tpq").value)*NQ*60;$("tsum").textContent="Tổng thời gian: "+Math.round(t/60*10)/10+" phút ("+fmt(t)+")";}
$("tpq").onchange=sumTime;sumTime();
function showBest(){const b=ls("g","tg_best");$("best").textContent=b?"Kết quả tốt nhất lần trước: "+b:"";}
showBest();
$("name").addEventListener("input",()=>$("nameErr").classList.add("hide"));

function answered(){return list.filter(q=>q.chosen!==undefined).length;}
function render(){
  const q=list[i];
  const locked=instant&&q.chosen!==undefined;
  $("pos").textContent="Câu "+(i+1)+"/"+list.length;
  $("sc").textContent="Đã trả lời: "+answered()+"/"+list.length;
  $("pb").style.width=(i/list.length*100)+"%";
  $("qt").textContent=q.q;
  $("fb").textContent="";$("fb").className="fb";
  $("prev").disabled=i===0;
  $("prev").classList.toggle("hide",instant);
  $("next").textContent=i===list.length-1?"Nộp bài":"Câu tiếp";
  $("next").disabled=instant&&q.chosen===undefined;
  const box=$("opts");box.innerHTML="";
  q.opts.forEach((t,k)=>{
    const b=document.createElement("button");b.className="opt";
    b.innerHTML='<b class="l">'+L[k]+'.</b><span></span>';
    b.lastChild.textContent=t;
    if(locked){
      b.disabled=true;
      if(k===q.ans)b.classList.add("ok");
      else if(k===q.chosen)b.classList.add("no");
    }else if(q.chosen===k){b.classList.add("sel");}
    b.onclick=()=>pick(k);
    box.appendChild(b);
  });
  if(locked){
    if(q.chosen===q.ans){$("fb").textContent="Chính xác!";$("fb").classList.add("ok");}
    else{$("fb").textContent="Chưa đúng. Đáp án đúng: "+L[q.ans]+". "+q.opts[q.ans];$("fb").classList.add("no");}
  }
}
function pick(k){
  const q=list[i];
  if(instant&&q.chosen!==undefined)return;
  q.chosen=k;
  render();
}
function submit(){
  const left=list.length-answered();
  const msg=left>0?"Bạn còn "+left+" câu chưa trả lời. Bạn có chắc chắn muốn nộp bài và xem kết quả?":"Bạn có chắc chắn muốn nộp bài và xem kết quả?";
  if(!confirm(msg))return;
  finish(false);
}
function finish(auto){
  stopTimer();
  const used=Math.min(totalSec,Math.round((Date.now()-startAt)/1000));
  show("result");
  $("tnote").classList.toggle("hide",!auto);
  $("tnote").textContent=auto?"Hết giờ! Bài làm đã được nộp tự động.":"";
  $("ru").textContent="Thời gian làm bài: "+fmt(used)+" / "+fmt(totalSec);
  const score=list.filter(q=>q.chosen===q.ans).length;
  const wrong=list.filter(q=>q.chosen!==q.ans);
  const pct=Math.round(score/list.length*100);
  $("rn").textContent=student;
  $("rs").textContent=score+"/"+list.length;
  $("rm").textContent="Tỷ lệ đúng: "+pct+"%. "+(pct>=80?"Rất tốt! Bạn nắm bài chắc rồi.":pct>=50?"Khá ổn, ôn lại các câu sai nhé.":"Cần ôn thêm, hãy xem lại các câu sai bên dưới.");
  const prev=parseInt(ls("g","tg_bestpct")||"-1");
  if(pct>(isNaN(prev)?-1:prev)){ls("s","tg_bestpct",pct);ls("s","tg_best",pct+"% ("+score+"/"+list.length+") - "+student);}
  const wb=$("wrongBox"), wl=$("wl");wl.innerHTML="";
  wb.classList.toggle("hide",!wrong.length);
  $("redo").classList.toggle("hide",!wrong.length);
  wrong.forEach((q,n)=>{
    const d=document.createElement("div");d.className="wr";
    const a=document.createElement("div");a.textContent=(n+1)+". "+q.q;a.style.fontWeight="600";
    const y=document.createElement("div");y.className="y"+(q.chosen===undefined?" n":"");
    y.textContent=q.chosen===undefined?"Bạn chưa trả lời":"Bạn chọn: "+q.opts[q.chosen];
    const c=document.createElement("div");c.className="a";c.textContent="Đáp án đúng: "+q.opts[q.ans];
    d.append(a,y,c);wl.appendChild(d);
  });
}
function build(src){
  return src.map(r=>{
    const opts=$("shuffleA").checked?shuf(r.slice(1)):r.slice(1);
    return {q:r[0],opts:opts,ans:opts.indexOf(r[1])};
  });
}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function tick(){
  const left=Math.ceil((endAt-Date.now())/1000);
  $("tm").textContent="⏱ "+fmt(left);
  $("tm").classList.toggle("low",left<=60);
  if(left<=0){stopTimer();finish(true);}
}
function start(items){
  list=items;i=0;
  totalSec=Math.round(parseFloat($("tpq").value)*items.length*60);
  startAt=Date.now();endAt=startAt+totalSec*1000;
  stopTimer();timer=setInterval(tick,500);
  show("quiz");render();tick();
}
$("go").onclick=()=>{
  student=$("name").value.trim().replace(/\s+/g," ");
  if(!student){$("nameErr").classList.remove("hide");$("name").focus();return;}
  ls("s","tg_name",student);
  instant=$("instant").checked;
  let src=$("shuffleQ").checked?shuf(DATA):DATA.slice();
  src=src.slice(0,NQ);
  start(build(src));
};
$("next").onclick=()=>{ if(i<list.length-1){i++;render();}else submit(); };
$("prev").onclick=()=>{ if(i>0){i--;render();} };
$("quit").onclick=()=>{ if(confirm("Thoát bài làm hiện tại? Kết quả sẽ không được lưu.")){stopTimer();show("start");showBest();} };
$("again").onclick=()=>$("go").click();
$("redo").onclick=()=>{
  const src=list.filter(q=>q.chosen!==q.ans).map(q=>[q.q,q.opts[q.ans],...q.opts.filter((_,k)=>k!==q.ans)]);
  start(build(shuf(src)));
};
$("home").onclick=()=>{stopTimer();show("start");showBest();};
</script>
</body>
